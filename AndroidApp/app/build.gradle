plugins {
    id "com.android.application"
}

android {
    namespace "com.chadmailer.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.chadmailer.mobile"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "API_BASE_URL", "\"http://10.0.2.2:5000/api/v1\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
